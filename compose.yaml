services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: local_notebook_password
      POSTGRES_DB: notebook
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres18}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d notebook"]
      interval: 3s
      timeout: 3s
      retries: 20
