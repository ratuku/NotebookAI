name: notebookai-deploy
x-backend: &backend
  image: notebook-ai-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://notebook:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}@postgres:5432/notebook
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    AI_MODE: ${AI_MODE:-rag}
    CORS_ORIGINS: '[]'
  init: true
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: notebook
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/deploy/postgres18}:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U notebook -d notebook']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    volumes:
      - models:/data/models
      - vectors:/data/qdrant
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  frontend:
    image: notebook-ai-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  models:
  vectors:
