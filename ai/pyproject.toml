[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "notebook-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["qdrant-client>=1.15,<2", "fastembed>=0.7,<1", "httpx>=0.28,<1", "python-pptx>=1.0,<2", "beautifulsoup4>=4.13,<5", "pypdf>=6,<7", "Pillow>=11,<13", "pydantic>=2.10,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py312"
