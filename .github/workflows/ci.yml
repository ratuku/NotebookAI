name: Pull request checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: notebook
          POSTGRES_PASSWORD: ci_notebook_password
          POSTGRES_DB: notebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notebook -d notebook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://notebook:ci_notebook_password@localhost:5432/notebook_test
      TEST_DATABASE_URL: postgresql+psycopg://notebook:ci_notebook_password@localhost:5432/notebook_test
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Backend style, migrations, and PostgreSQL tests
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          alembic upgrade head
          alembic check
          pytest -q
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck, tests, and build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Start backend
        working-directory: backend
        run: |
          uvicorn notebook_backend.main:app --host 127.0.0.1 --port 8000 > /tmp/notebook-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/notebook-api.log
          exit 1
      - name: Browser tests (desktop and mobile)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
